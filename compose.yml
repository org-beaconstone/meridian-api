services:
  api:
    build: .
    environment:
      MERIDIAN_BIND: 0.0.0.0
      MERIDIAN_DB_URL: jdbc:h2:file:/app/data/meridian-connected
      MERIDIAN_WEBHOOK_SECRET: ${MERIDIAN_WEBHOOK_SECRET:-}
    ports: ['127.0.0.1:8080:8080']
    volumes: ['meridian-data:/app/data']
  web:
    build:
      context: ../meridian-web
      args:
        VITE_API_BASE_URL: /api/v1
    ports: ['127.0.0.1:5175:80']
    depends_on: [api]
  mobile:
    build: ../meridian-mobile
    ports: ['127.0.0.1:5176:80']
    depends_on: [api]
volumes:
  meridian-data:
