spring:
  application:
    name: meridian-api
  datasource:
    url: ${MERIDIAN_DB_URL:jdbc:h2:file:./data/meridian-connected}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
server:
  address: ${MERIDIAN_BIND:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
meridian:
  webhook:
    secret: ${MERIDIAN_WEBHOOK_SECRET:}
  circuit-breaker:
    error-rate-threshold: 0.05
    window-seconds: 60
    min-samples: 20
    open-cooldown-seconds: 30
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: meridian-api
    distribution:
      percentiles-histogram:
        payment.authorization: true
      slo:
        payment.authorization: 800ms
logging:
  level:
    root: WARN
